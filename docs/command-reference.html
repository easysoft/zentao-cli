<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="禅道 CLI 命令参考，按模块、操作类型和参数快速检索。">
  <title>命令参考 · ZenTao CLI</title>
  <style>
    /* Reference reader: DESIGN_VARIANCE 3, MOTION_INTENSITY 1, VISUAL_DENSITY 7.
       Native controls; 6px control radius; one blue accent; no external assets. */
    :root {
      --bg: #f7f9fc; --surface: #fcfdff; --muted-surface: #f0f3f8; --line: #dce2eb;
      --text: #1c2637; --muted: #596579; --accent: #1756bf; --accent-bg: #e8f0ff;
      --code: #eef2f8; --focus: #1756bf; --shadow: #182b491a;
      font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text); background: var(--bg); color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #141922; --surface: #191f2a; --muted-surface: #222b39; --line: #343f50;
      --text: #e4eaf3; --muted: #a7b3c6; --accent: #8bb5ff; --accent-bg: #253958;
      --code: #242e3e; --focus: #8bb5ff; --shadow: #00000030;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    button, input, select { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button, input, select { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    button { padding: 6px 12px; white-space: nowrap; }
    button:hover { background: var(--muted-surface); }
    button:active { background: var(--accent-bg); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    a { color: var(--accent); text-underline-offset: 3px; }
    code, pre, .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    code { font-size: .92em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .skip-link { position: fixed; top: 8px; left: 8px; padding: 8px 16px; transform: translateY(-180%); background: var(--surface); z-index: 2; }
    .skip-link:focus { transform: translateY(0); }
    .topbar { display: grid; grid-template-columns: 216px minmax(200px, 640px) 1fr; gap: 24px; align-items: center; padding: 16px 24px 16px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .brand { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; font-size: 22px; letter-spacing: -.8px; font-weight: 750; }
    .brand span { color: var(--accent); font-size: 13px; letter-spacing: 0; font-weight: 650; }
    .search-box { display: flex; align-items: center; gap: 12px; }
    .search-box input { width: 100%; min-width: 0; height: 40px; padding: 8px 13px; background: var(--bg); }
    input::placeholder { color: var(--muted); opacity: 1; }
    .shortcut { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 7px; color: var(--muted); }
    .appearance { justify-self: end; display: flex; align-items: center; gap: 9px; color: var(--muted); }
    .appearance select { padding: 5px 7px; }
    .layout { min-height: 0; display: grid; grid-template-columns: 216px 300px minmax(0, 1fr); }
    .sidebar { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
    .sidebar-title { margin: 21px 20px 12px; font-size: 16px; font-weight: 680; }
    .scope-nav { overflow: auto; padding: 0 10px 16px; flex: 1; scrollbar-width: thin; }
    .nav-label { margin: 22px 10px 7px; font-size: 12px; font-weight: 650; color: var(--muted); }
    .scope-button { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: transparent; border-radius: 5px; padding: 7px 10px; text-align: left; font-size: 13px; }
    .scope-button[aria-current="true"] { color: var(--accent); background: var(--accent-bg); font-weight: 650; }
    .scope-button .count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-left: 5px; }
    .module-name { margin-left: 6px; color: var(--muted); font-size: 10px; }
    .sidebar-footer { padding: 13px 20px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
    .results { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
    .results-tools { padding: 20px 18px 14px; border-bottom: 1px solid var(--line); }
    .results-heading { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .results-heading h2 { margin: 0; font-size: 15px; font-weight: 650; flex: 1; }
    .results-heading span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .filter-row { display: flex; align-items: center; gap: 8px; }
    .filter-row select { padding: 5px 8px; width: 100%; min-width: 0; }
    .reset-button { color: var(--muted); border: 0; background: transparent; padding: 4px 0 4px 4px; }
    .mobile-scope { display: none; margin-bottom: 10px; }
    .mobile-scope select { width: 100%; padding: 6px 8px; }
    .result-list { overflow: auto; min-height: 0; padding: 5px 0 20px; scrollbar-width: thin; }
    .result-item { display: block; width: 100%; border: 0; border-left: 3px solid transparent; border-radius: 0; padding: 13px 17px 13px 15px; text-align: left; background: transparent; white-space: normal; }
    .result-item + .result-item { border-top: 1px solid var(--line); }
    .result-item[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-bg); }
    .result-item .title { display: block; font-size: 12px; font-weight: 650; overflow-wrap: anywhere; line-height: 1.6; }
    .result-item .description { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; font-size: 12px; line-height: 1.6; color: var(--muted); }
    .result-item .entry-type { display: block; margin-top: 6px; color: var(--muted); font-size: 10px; }
    .empty { padding: 40px 23px; color: var(--muted); }
    .empty strong { display: block; color: var(--text); margin-bottom: 7px; font-size: 16px; }
    .empty button { margin-top: 15px; }
    .reader { min-width: 0; min-height: 0; overflow: auto; background: var(--surface); scrollbar-width: thin; }
    .reader-inner { max-width: 1080px; padding: 26px 36px 80px; margin-inline: auto; }
    .reader-top { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .breadcrumb { color: var(--muted); font-size: 12px; flex: 1; }
    .text-button { color: var(--muted); background: transparent; padding: 4px 9px; font-size: 12px; }
    .mobile-back { display: none; }
    .reader h1 { font-size: clamp(23px, 2vw, 31px); font-weight: 680; letter-spacing: -.7px; line-height: 1.4; margin: 0 0 10px; overflow-wrap: anywhere; }
    .reader .lead { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .entry-badge { display: inline-block; color: var(--accent); background: var(--accent-bg); padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 7px; }
    .parameter-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 0 16px; margin-bottom: 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .parameter-tools input[type="search"] { flex: 1; min-width: 150px; width: 220px; padding: 6px 10px; font-size: 12px; }
    .required-control { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
    input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
    .parameter-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .parameter-empty { color: var(--muted); background: var(--muted-surface); border-radius: 6px; padding: 10px 12px; font-size: 12px; }
    .prose { font-size: 13px; line-height: 1.85; overflow-wrap: break-word; }
    .prose h2 { font-size: 21px; line-height: 1.5; margin: 32px 0 12px; letter-spacing: -.3px; }
    .prose h3 { font-size: 16px; margin: 29px 0 10px; }
    .prose p { margin: 14px 0; }
    .prose code { background: var(--code); border-radius: 3px; padding: 2px 4px; overflow-wrap: anywhere; }
    .prose ul, .prose ol { padding-left: 22px; }
    .prose li { margin: 5px 0; }
    .code-block { position: relative; margin: 18px 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--code); }
    .code-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 11px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .code-toolbar button { border: 0; background: transparent; color: var(--accent); font-size: 11px; padding: 1px 5px; }
    .prose pre { margin: 0; padding: 15px 17px; overflow: auto; font-size: 12px; line-height: 1.8; tab-size: 2; }
    .prose pre code { padding: 0; border-radius: 0; background: transparent; white-space: pre; }
    .table-scroll { overflow: auto; width: 100%; margin: 18px 0; border: 1px solid var(--line); border-radius: 6px; }
    .prose table { border-collapse: collapse; width: 100%; font-size: 12px; line-height: 1.75; text-align: left; }
    .prose th { background: var(--muted-surface); font-weight: 600; color: var(--muted); white-space: nowrap; padding: 10px 11px; }
    .prose td { padding: 11px; vertical-align: top; border-top: 1px solid var(--line); }
    .prose table td:first-child { min-width: 105px; }
    .prose table.parameter-table { min-width: 670px; }
    .prose table.parameter-table td:nth-child(1) { width: 19%; }
    .prose table.parameter-table td:nth-child(2), .prose table.parameter-table td:nth-child(4) { white-space: nowrap; width: 7%; }
    .prose table.parameter-table td:nth-child(3), .prose table.parameter-table td:nth-child(5) { width: 10%; }
    .prose table.parameter-table td:nth-child(3) code { white-space: nowrap; }
    .prose table.parameter-table td:last-child { min-width: 215px; }
    .prose .is-required { color: var(--accent); font-weight: 650; }
    .long-description summary { cursor: pointer; }
    .long-description .preview { color: var(--text); }
    .long-description .expand-label, .long-description .collapse-label { display: block; color: var(--accent); font-size: 11px; margin-top: 5px; }
    .long-description .collapse-label { display: none; }
    .long-description[open] .preview, .long-description[open] .expand-label { display: none; }
    .long-description[open] .collapse-label { display: inline; }
    .long-description .full-description { margin-top: 9px; }
    .copy-notice { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); max-width: min(90vw, 460px); padding: 9px 15px; background: var(--text); color: var(--surface); border-radius: 6px; box-shadow: 0 4px 22px var(--shadow); font-size: 12px; z-index: 1; }
    @media (max-width: 1100px) {
      .topbar { grid-template-columns: 185px minmax(180px, 1fr) auto; gap: 16px; }
      .layout { grid-template-columns: 185px 270px minmax(0, 1fr); }
      .reader-inner { padding: 23px 24px 65px; }
      .appearance label { display: none; }
      .module-name { display: none; }
    }
    @media (max-width: 950px) {
      .sidebar { display: none; }
      .layout { grid-template-columns: 280px minmax(0, 1fr); }
      .mobile-scope { display: block; }
      .topbar { grid-template-columns: auto minmax(180px, 1fr) auto; }
    }
    @media (max-width: 700px) {
      .topbar { grid-template-columns: 1fr auto; gap: 10px; padding: 12px 16px; }
      .brand { font-size: 20px; }
      .appearance { grid-column: 2; grid-row: 1; }
      .search-box { grid-column: 1 / -1; grid-row: 2; }
      .shortcut { display: none; }
      .layout { grid-template-columns: minmax(0, 1fr); }
      .results { border: 0; }
      .results-tools { padding: 16px; }
      .mobile-scope { margin-bottom: 9px; }
      .reader-inner { padding: 19px 18px 60px; }
      .result-item { padding: 14px 18px; }
      .result-item .title { font-size: 13px; }
      .result-item .entry-type { display: inline; }
      .result-item .description { -webkit-line-clamp: 1; }
      .mobile-back { display: inline-flex; }
      .reader-top { flex-wrap: wrap; gap: 7px; margin-bottom: 22px; }
      .reader h1 { font-size: 24px; }
      .breadcrumb { flex-basis: 100%; order: 1; margin-top: 7px; }
      #copy-link { margin-left: auto; }
      body[data-mobile-view="list"] .reader { display: none; }
      body[data-mobile-view="reader"] .results { display: none; }
      .parameter-tools { gap: 10px 12px; }
      .parameter-tools input[type="search"] { flex-basis: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
    @media print {
      body { display: block; height: auto; overflow: visible; background: white; color: black; }
      .topbar, .sidebar, .results, .reader-top, .parameter-tools, .code-toolbar, .copy-notice { display: none !important; }
      .layout, .reader { display: block !important; overflow: visible; }
      .reader-inner { max-width: none; padding: 0; }
      .table-scroll, .prose pre { overflow: visible; }
      .prose pre code { white-space: pre-wrap; }
    }
  </style>
</head>

  <script id="reference-data" type="application/json">{"version":"0.2.0","sdkVersion":"0.6.8","actionCount":229,"modules":[{"name":"user","display":"用户"},{"name":"program","display":"项目集"},{"name":"product","display":"产品"},{"name":"project","display":"项目"},{"name":"execution","display":"执行"},{"name":"productplan","display":"产品计划"},{"name":"story","display":"需求"},{"name":"epic","display":"业务需求"},{"name":"requirement","display":"用户需求"},{"name":"bug","display":"Bug"},{"name":"testcase","display":"测试用例"},{"name":"task","display":"任务"},{"name":"issue","display":"问题"},{"name":"risk","display":"风险"},{"name":"meeting","display":"会议"},{"name":"feedback","display":"反馈"},{"name":"ticket","display":"工单"},{"name":"system","display":"应用"},{"name":"build","display":"版本"},{"name":"testtask","display":"测试单"},{"name":"release","display":"发布"},{"name":"file","display":"附件"},{"name":"workflow","display":"工作流"},{"name":"doc","display":"文档"},{"name":"todo","display":"待办"},{"name":"my","display":"地盘"}],"entries":[{"id":"usage","title":"命令格式与传参","description":"简写、别名、ID、JSON、数组、管道和批量操作","group":"guides","type":"guide","html":"\u003cpre>\u003ccode class=\"language-text\">zentao [全局选项] &lt;命令&gt; [参数]\nzentao [全局选项] &lt;模块&gt; &lt;操作&gt; [--参数名=值 ...]\n\u003c/code>\u003c/pre>\n\u003cp>用法中的 \u003ccode>&lt;...&gt;\u003c/code> 表示需要替换的值，\u003ccode>[...]\u003c/code> 表示可选部分，\u003ccode>...\u003c/code> 表示可以重复。用法模板不能原样粘贴执行。后文 Bash 示例中的 ID、账号、地址、文件路径和业务内容也需要换成实际值。\u003c/p>\n\u003cp>推荐将全局选项放在命令前，将业务参数写成 \u003ccode>--参数名=值\u003c/code>，保留参数名的大小写，例如 \u003ccode>--productID=1\u003c/code>、\u003ccode>--recPerPage=50\u003c/code>。业务字段不要写成 \u003ccode>--title 标题\u003c/code>；这类动态参数需要等号。包含空格或 Shell 特殊字符的值使用引号，例如 \u003ccode>--title='登录失败'\u003c/code>、\u003ccode>--filter='pri&lt;=2'\u003c/code>。\u003c/p>\n\u003ch3>简写、别名与帮助\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>写法\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>zentao &lt;模块&gt;\u003c/code>\u003c/td>\u003ctd>执行该模块的默认 \u003ccode>list\u003c/code>；没有默认列表的模块会显示帮助\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao &lt;模块&gt; &lt;数字ID&gt;\u003c/code>\u003c/td>\u003ctd>执行该模块的 \u003ccode>get\u003c/code>，前提是该模块支持此操作\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao &lt;模块&gt; &lt;操作&gt; [参数]\u003c/code>\u003c/td>\u003ctd>执行明确命名的操作，包括关联列表和状态流转\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao &lt;模块&gt; props\u003c/code>\u003c/td>\u003ctd>离线查询返回对象的属性定义，支持 \u003ccode>--format=json\u003c/code>、\u003ccode>--format=raw\u003c/code> 和 \u003ccode>--silent\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao help\u003c/code> / \u003ccode>zentao --help\u003c/code> / \u003ccode>zentao\u003c/code>\u003c/td>\u003ctd>查看一级命令及全局选项\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao &lt;模块&gt; --help\u003c/code> / \u003ccode>zentao &lt;模块&gt; help\u003c/code>\u003c/td>\u003ctd>查看模块概览\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao help &lt;模块&gt;\u003c/code>\u003c/td>\u003ctd>一次查看该模块所有操作的详细参数\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao &lt;模块&gt; &lt;操作&gt; --help\u003c/code> / \u003ccode>zentao &lt;模块&gt; &lt;操作&gt; help\u003c/code>\u003c/td>\u003ctd>查看指定操作参数\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao &lt;内置命令&gt; --help\u003c/code>\u003c/td>\u003ctd>查看登录、配置、安装等命令的帮助\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao list &lt;模块&gt;\u003c/code>\u003c/td>\u003ctd>\u003ccode>zentao ls &lt;模块&gt;\u003c/code> 的别名\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao &lt;模块&gt; ls\u003c/code>\u003c/td>\u003ctd>该模块 \u003ccode>list\u003c/code> 操作的别名，要求模块支持默认列表\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>zentao plan ...\u003c/code>\u003c/td>\u003ctd>\u003ccode>zentao productplan ...\u003c/code> 的别名\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>只有各模块索引中列出的操作才可调用；不是每个模块都支持全部增删改查操作。\u003ccode>props\u003c/code> 描述返回对象的字段，写入时可以提交哪些字段请查对应操作的参数表。\u003c/p>\n\u003ch3>ID、范围与关联列表\u003c/h3>\n\u003cp>优先使用参数表中的完整 ID 名称，例如 \u003ccode>--bugID=42\u003c/code>。首个路径 ID 可以写成 \u003ccode>--id=42\u003c/code> 或首个数字位置参数；一个操作需要多个路径 ID 时，其余 ID 必须分别提供。例如：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao bug get --bugID=42\nzentao bug 42\nzentao doc myDocs --spaceID=1 --libID=2\n\u003c/code>\u003c/pre>\n\u003cp>带有 \u003ccode>scope\u003c/code>、\u003ccode>scopeID\u003c/code> 的操作需要指定查询范围。可以用参数表下列出的 \u003ccode>--product\u003c/code>、\u003ccode>--project\u003c/code> 或 \u003ccode>--execution\u003c/code> 简写代替这两个参数，每次选择一个范围。例如 \u003ccode>zentao bug --product=1\u003c/code>。其他操作里的同名字段按其自身定义解释，不表示所有列表都支持按产品、项目或执行筛选。\u003c/p>\n\u003ch3>JSON、数组与标准输入\u003c/h3>\n\u003cp>\u003ccode>--params\u003c/code> 接受一个 JSON 对象，可同时传路径、查询和请求体字段；\u003ccode>--data\u003c/code> 接受请求体 JSON，适用于创建、更新和状态流转。数组和包含嵌套结构的字段优先使用 JSON，以保留类型。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao bug resolve --params '{&quot;bugID&quot;:42,&quot;resolution&quot;:&quot;fixed&quot;}'\nzentao bug create --productID=1 --data '{&quot;title&quot;:&quot;登录失败&quot;,&quot;openedBuild&quot;:[&quot;trunk&quot;],&quot;severity&quot;:2}'\nzentao story change 11 --data '{&quot;reviewer&quot;:[&quot;admin&quot;],&quot;title&quot;:&quot;更新后的需求标题&quot;}'\nzentao product create --data @- &lt; product.json\n\u003c/code>\u003c/pre>\n\u003cp>最后一个示例读取本地 \u003ccode>product.json\u003c/code>，其内容可以是 \u003ccode>{&quot;name&quot;:&quot;团队知识库&quot;}\u003c/code>。未提供 \u003ccode>--data\u003c/code> 时，写操作也会尝试读取标准输入中的 JSON。\u003ccode>--data @-\u003c/code> 明确要求从标准输入读取；空输入或非法 JSON 会报错。读取文件请使用输入重定向，\u003ccode>--data @文件名\u003c/code> 不支持。\u003c/p>\n\u003cp>同一字段尽量只用一种传法。混用时，\u003ccode>--params\u003c/code> 覆盖已解析的公共选项，动态 \u003ccode>--key=value\u003c/code> 再覆盖 \u003ccode>--params\u003c/code> 中的同名值；首个数字位置参数最后写入 \u003ccode>id\u003c/code>。组装请求体时，\u003ccode>--data\u003c/code> 内的字段优先于外层的同名字段，其次才使用参数定义中的默认值。\u003c/p>\n\u003ch3>更新、批量与删除\u003c/h3>\n\u003cp>更新操作会先读取原对象，自动补全未提交的字段；通常只需提交要修改的字段。参数表中标记为必填的请求体字段可能由原对象补全，创建操作仍需提供必填内容。\u003c/p>\n\u003cp>支持按 ID 操作的命令可以通过 \u003ccode>--id=1,2\u003c/code> 或数字位置参数 \u003ccode>1,2\u003c/code> 批量执行。批量处理的对象是首个路径 ID；其他路径参数保持本次传入的值。默认继续处理后续对象，\u003ccode>--batch-fail-fast\u003c/code> 可在失败后停止。批量结果会分别列出成功、失败和跳过的 ID。\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao product get --id=1,2\nzentao product update --id=1,2 --desc='统一更新的说明'\nzentao product delete --id=1,2 --yes\n\u003c/code>\u003c/pre>\n\u003cp>交互终端中的删除会要求确认。非交互、JSON、raw 或 \u003ccode>--machine-readable\u003c/code> 模式下，删除必须显式添加 \u003ccode>--yes\u003c/code>，否则报错。批量操作不会回滚已经成功的项目。\u003c/p>\n"},{"id":"examples","title":"常用示例","description":"登录、查询、筛选、业务操作、文档和附件的实际用法","group":"guides","type":"guide","html":"\u003ch3>登录并查看数据\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\"># 在终端交互输入服务地址、账号和凭证\nzentao login\n\n# 查看本地账号，切换当前账号\nzentao profile\nzentao profile 'admin@https://zentao.example.com'\n\n# 查看产品以及产品中的 Bug\nzentao product --pick=id,name\nzentao bug --product=1 --pick=id,title,status\n\u003c/code>\u003c/pre>\n\u003ch3>筛选、搜索、排序与分页\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\"># 当前返回页内筛选和排序\nzentao bug --product=1 --filter='status=active,pri&lt;=2' --sort=pri:asc,id:desc\nzentao bug --product=1 --search='登录,失败' --search-fields=title,steps\n\n# 单个 --filter / --search 内的条件为 AND，重复该选项表示 OR\nzentao bug --product=1 --filter='status=active' --filter='status=resolved'\n\n# 分页获取，并输出 JSON\nzentao --format=json bug --product=1 --page=1 --recPerPage=50\nzentao --format=json bug --product=1 --page=2 --recPerPage=50\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>--filter\u003c/code>、\u003ccode>--search\u003c/code>、\u003ccode>--sort\u003c/code>、\u003ccode>--pick\u003c/code>、\u003ccode>--limit\u003c/code> 是客户端处理；服务端查询参数（如 \u003ccode>browseType\u003c/code>、\u003ccode>orderBy\u003c/code>、\u003ccode>filters\u003c/code>）按操作参数表传入。客户端筛选只作用于当前页，不会改变服务器的总数，也不会自动补足匹配数量。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>值的写法\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>--pick\u003c/code>\u003c/td>\u003ctd>逗号分隔的字段名，如 \u003ccode>id,title,assignedTo.realname\u003c/code>；JSON 保留嵌套对象结构，忽略不存在的字段\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--filter\u003c/code>\u003c/td>\u003ctd>\u003ccode>字段运算符值\u003c/code>，支持 \u003ccode>=\u003c/code>、\u003ccode>:\u003c/code>（等于的兼容写法）、\u003ccode>!=\u003c/code>、\u003ccode>&gt;\u003c/code>、\u003ccode>&lt;\u003c/code>、\u003ccode>&gt;=\u003c/code>、\u003ccode>&lt;=\u003c/code>、\u003ccode>~\u003c/code>（包含）、\u003ccode>!~\u003c/code>（不包含）；字段支持点号路径\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--search\u003c/code>\u003c/td>\u003ctd>逗号分隔的关键词，大小写不敏感；不提供 \u003ccode>--search-fields\u003c/code> 时递归搜索对象和数组中的值\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--search-fields\u003c/code>\u003c/td>\u003ctd>逗号分隔的字段名，支持点号路径，例如 \u003ccode>title,assignedTo.realname\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--sort\u003c/code>\u003c/td>\u003ctd>逗号分隔的 \u003ccode>字段:asc\u003c/code> 或 \u003ccode>字段:desc\u003c/code>，支持点号路径，兼容 \u003ccode>字段_asc\u003c/code> / \u003ccode>字段_desc\u003c/code>\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>过滤值含逗号时，可在表达式内保留引号，例如 \u003ccode>--filter='title~&quot;登录,注册&quot;'\u003c/code>；外层引号交给 Shell，内层引号用于区分值中的逗号与条件分隔符。\u003c/p>\n\u003cp>仅当操作参数表列出 \u003ccode>pageID\u003c/code> / \u003ccode>recPerPage\u003c/code> 时使用对应分页选项。\u003ccode>--page\u003c/code> 是 \u003ccode>pageID\u003c/code> 的别名，\u003ccode>--limit\u003c/code> 只截取当前页，\u003ccode>--all\u003c/code> 尚未实现并会报错。需要全部数据时，应逐页读取直到覆盖返回的总数。\u003c/p>\n\u003ch3>创建与处理业务对象\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">zentao product create --name='团队知识库'\nzentao story create --productID=1 --title='支持全文搜索'\nzentao task create --executionID=1 --name='实现搜索接口' --type=devel --assignedTo=admin --estimate=4\nzentao bug resolve 42 --resolution=fixed --resolvedBuild=trunk\nzentao execution projectExecutions --projectID=5 --browseType=all\nzentao my tasks --pick=id,name,status\n\u003c/code>\u003c/pre>\n\u003ch3>文档与附件\u003c/h3>\n\u003cpre>\u003ccode class=\"language-bash\">zentao doc mySpaces\nzentao doc myLibs --spaceID=1\nzentao doc createMyDoc --spaceID=1 --libID=2 --data '{&quot;title&quot;:&quot;开发说明&quot;,&quot;content&quot;:&quot;# 开发说明\\n\\n正文&quot;,&quot;contentType&quot;:&quot;doc&quot;}'\nzentao file create --file=/path/to/screenshot.png --objectType=bug --objectID=42\n\u003c/code>\u003c/pre>\n\u003cp>文档的 \u003ccode>contentType=doc\u003c/code> 将 Markdown 正文转换为协作文档内容，\u003ccode>contentType=html\u003c/code> 保存旧格式 HTML。附件上传的 \u003ccode>file\u003c/code> 是本地文件路径，默认大小上限为 50 MiB。\u003c/p>\n"},{"id":"errors","title":"错误处理与版本兼容","description":"输出格式、失败处理、版本要求和参考文档覆盖范围","group":"guides","type":"guide","html":"\u003cp>未设置输出格式时，业务查询默认输出 Markdown；\u003ccode>--format=json\u003c/code> 输出处理后的结构化结果；\u003ccode>--format=raw\u003c/code> 保留服务端响应内容，跳过 HTML 转 Markdown、客户端筛选、排序和字段摘取。内置命令的输出以各节说明为准；\u003ccode>--machine-readable\u003c/code> 只禁用 Markdown ANSI 渲染，不会自动切换为 JSON。\u003c/p>\n\u003cp>命令失败以非零状态退出，批量操作中任一对象失败时也会非零退出。批量请求应同时检查返回的失败和跳过列表，定位具体对象。错误代码及排查方法见 \u003ca href=\"./errors.md\">常见错误排查与参考手册\u003c/a>。\u003c/p>\n\u003cp>每个业务操作下方都列出最低禅道版本，开源版、企业版（\u003ccode>biz\u003c/code>）、旗舰版（\u003ccode>max\u003c/code>）与 IPD 版分别比较。版本不足时会在业务请求前报 \u003ccode>E2010\u003c/code>。帮助与 \u003ccode>props\u003c/code> 可以离线使用；文档中列出某个操作，不代表当前服务器版本和当前账号权限均允许执行。\u003c/p>\n\u003c!-- BEGIN GENERATED COMMAND REFERENCE -->\n\u003ch2>覆盖范围\u003c/h2>\n\u003cp>对应当前工作区：CLI \u003cstrong>0.2.0\u003c/strong>，API 定义 \u003cstrong>0.6.8\u003c/strong>；覆盖 \u003cstrong>17 个内置一级命令\u003c/strong>（另含 config get/set）、\u003cstrong>26 个业务模块、229 个业务操作\u003c/strong>。已安装版本不同时，请以本机命令的 --help 为准。\u003c/p>\n"},{"id":"global-options","title":"全局选项","description":"输出格式、配置文件、超时、证书验证和环境变量","group":"guides","type":"guide","html":"\u003cpre>\u003ccode class=\"language-text\">用法: zentao [options] [command]\n\n禅道命令行工具，支持在你喜爱的终端里访问和操作禅道数据\n\n选项:\n  -V, --version                             显示版本号\n  --format &lt;format&gt;                         输出格式 (markdown|json|raw)\n  --silent                                  静默模式\n  --insecure                                跳过 SSL/TLS 证书验证\n  --timeout &lt;ms&gt;                            请求超时时间（毫秒）\n  --config &lt;config_file&gt;                    指定自定义配置文件路径（亦可通过 ZENTAO_CONFIG_FILE 环境变量设置）\n  --machine-readable                        禁用 Markdown ANSI 渲染；删除操作仍需显式传入 --yes\n  -h, --help                                显示命令帮助\n\u003c/code>\u003c/pre>\n\u003cp>全局选项并不保证每个内置命令都改变输出格式或完全静默；业务命令支持情况见公共选项和各操作说明。\u003c/p>\n\u003ch3>环境变量\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>变量\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>ZENTAO_URL\u003c/td>\u003ctd>禅道服务地址\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ZENTAO_ACCOUNT\u003c/td>\u003ctd>登录账号\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ZENTAO_PASSWORD\u003c/td>\u003ctd>登录密码\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ZENTAO_TOKEN\u003c/td>\u003ctd>登录 Token；完整环境凭证中同时存在密码与 Token 时优先使用 Token\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ZENTAO_CONFIG_FILE\u003c/td>\u003ctd>自定义配置文件路径；显式 --config 优先\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>业务调用优先使用完整环境凭证（地址、账号以及 Token 或密码），否则使用当前本地登录记录。zentao login 的 --useEnv 专门用于强制使用环境变量登录。配置文件路径支持 ~ 和相对路径；更改配置路径会隔离登录记录与账号配置。\u003c/p>\n"},{"id":"data-options","title":"业务命令公共选项","description":"字段摘取、过滤、搜索、排序、分页和请求数据","group":"guides","type":"guide","html":"\u003cp>以下选项由业务模块与通用增删改查入口共用。参数是否适用于当前操作，仍由结果类型和操作参数表决定。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>--pick &lt;fields&gt;\u003c/code>\u003c/td>\u003ctd>摘取指定字段（逗号分隔）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--filter &lt;expr&gt;\u003c/code>\u003c/td>\u003ctd>过滤条件（组内 AND，多次指定为 OR）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--sort &lt;expr&gt;\u003c/code>\u003c/td>\u003ctd>排序条件（如 pri:desc,id:asc）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--search &lt;keywords&gt;\u003c/code>\u003c/td>\u003ctd>搜索关键词（组内 AND，多次指定为 OR）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--search-fields &lt;fields&gt;\u003c/code>\u003c/td>\u003ctd>搜索字段（逗号分隔）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--page &lt;number&gt;\u003c/code>\u003c/td>\u003ctd>页码\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--recPerPage &lt;number&gt;\u003c/code>\u003c/td>\u003ctd>每页条数\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--all\u003c/code>\u003c/td>\u003ctd>尚未支持自动翻页，请使用 --page 和 --recPerPage\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--limit &lt;number&gt;\u003c/code>\u003c/td>\u003ctd>限制获取数量\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--data &lt;json&gt;\u003c/code>\u003c/td>\u003ctd>JSON 数据\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--params &lt;json&gt;\u003c/code>\u003c/td>\u003ctd>API 调用参数\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--yes\u003c/code>\u003c/td>\u003ctd>跳过确认\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--silent\u003c/code>\u003c/td>\u003ctd>静默模式\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--batch-fail-fast\u003c/code>\u003c/td>\u003ctd>批量操作出错时停止\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--id &lt;id&gt;\u003c/code>\u003c/td>\u003ctd>对象 ID\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--product &lt;id&gt;\u003c/code>\u003c/td>\u003ctd>产品 ID\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--project &lt;id&gt;\u003c/code>\u003c/td>\u003ctd>项目 ID\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--execution &lt;id&gt;\u003c/code>\u003c/td>\u003ctd>执行 ID\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>列表操作支持客户端筛选、搜索、排序、字段摘取和数量限制；详情操作支持字段摘取；写操作可提交 --data；删除可使用 --yes。--params 接受路径、查询和请求体的业务参数，不应作为 --filter、--sort、--format 等客户端选项的替代入口。\u003c/p>\n\u003cp>分页、raw 输出、批量处理和动态字段的等号写法见前文。--silent 对业务命令省略正常结果，仍报告错误；--batch-fail-fast 只控制当前批次，不回滚已完成的操作。\u003c/p>\n"},{"id":"configuration","title":"配置项","description":"各项配置的默认值、允许值和作用范围","group":"guides","type":"guide","html":"\u003cp>以下默认值用于当前账号尚未配置的项目。命令行中显式指定的对应选项优先。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>配置项\u003c/th>\u003cth>默认值\u003c/th>\u003cth>允许值与用途\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>defaultOutputFormat\u003c/code>\u003c/td>\u003ctd>\u003ccode>&quot;markdown&quot;\u003c/code>\u003c/td>\u003ctd>业务命令默认输出：markdown、json 或 raw\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>defaultRecPerPage\u003c/code>\u003c/td>\u003ctd>\u003ccode>20\u003c/code>\u003c/td>\u003ctd>默认每页条数，整数 1–1000；仅适用于支持分页的列表\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>insecure\u003c/code>\u003c/td>\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\u003ctd>是否跳过 SSL/TLS 证书验证\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>timeout\u003c/code>\u003c/td>\u003ctd>\u003ccode>10000\u003c/code>\u003c/td>\u003ctd>请求超时时间，单位毫秒，必须为正整数\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>htmlToMarkdown\u003c/code>\u003c/td>\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\u003ctd>是否将查询结果中的 HTML 字段转换为 Markdown；raw 输出不转换\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>batchFailFast\u003c/code>\u003c/td>\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\u003ctd>批量操作遇到失败时是否停止后续处理\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>pagers\u003c/code>\u003c/td>\u003ctd>\u003ccode>{}\u003c/code>\u003c/td>\u003ctd>各模块每页条数的 JSON 对象，值为整数 1–1000，覆盖 defaultRecPerPage\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>silent\u003c/code>\u003c/td>\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\u003ctd>业务命令是否省略正常结果输出；错误仍会报告\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>jsonPretty\u003c/code>\u003c/td>\u003ctd>\u003ccode>false\u003c/code>\u003c/td>\u003ctd>是否缩进输出业务命令的 JSON\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n"},{"id":"builtin-commands","title":"内置命令索引","description":"登录、账号、配置、MCP、技能安装和通用操作","group":"guides","type":"guide","html":"\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>命令\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ca href=\"#command-help\">help\u003c/a>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-login\">login\u003c/a>\u003c/td>\u003ctd>登录禅道服务\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-logout\">logout\u003c/a>\u003c/td>\u003ctd>退出当前用户登录\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-profile\">profile\u003c/a>\u003c/td>\u003ctd>查看或切换用户配置\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-config\">config\u003c/a>\u003c/td>\u003ctd>管理用户配置\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-version\">version\u003c/a>\u003c/td>\u003ctd>显示版本信息\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-autocomplete\">autocomplete\u003c/a>\u003c/td>\u003ctd>生成 shell 自动补全脚本\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-add-skill\">add-skill\u003c/a>\u003c/td>\u003ctd>安装禅道 CLI 技能到 AI Agent，或导出至指定目录\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-add-mcp\">add-mcp\u003c/a>\u003c/td>\u003ctd>配置禅道 MCP 服务到 AI Agent\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-mcp\">mcp\u003c/a>\u003c/td>\u003ctd>启动 MCP (Model Context Protocol) 服务，供 AI Agents 通过 stdio 访问禅道数据\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-ls\">ls\u003c/a>\u003c/td>\u003ctd>获取对象列表\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-get\">get\u003c/a>\u003c/td>\u003ctd>获取单个对象\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-create\">create\u003c/a>\u003c/td>\u003ctd>创建对象\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-update\">update\u003c/a>\u003c/td>\u003ctd>更新对象\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-delete\">delete\u003c/a>\u003c/td>\u003ctd>删除对象\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-do\">do\u003c/a>\u003c/td>\u003ctd>执行对象操作\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#command-upgrade\">upgrade\u003c/a>\u003c/td>\u003ctd>检查并升级 CLI 到最新版本\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n"},{"id":"command-help","title":"zentao help","description":"显示命令帮助","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>显示命令帮助\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao help [options] [command]\n\u003c/code>\u003c/pre>\n\u003cp>模块名会展开该模块全部操作；内置命令名会显示该命令帮助。支持离线使用。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>command\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>子命令或模块名\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao help\nzentao help bug\nzentao help login\nzentao doc createMyDoc --help\n\u003c/code>\u003c/pre>\n"},{"id":"command-login","title":"zentao login","description":"登录禅道服务","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>登录禅道服务\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao login [options]\n\u003c/code>\u003c/pre>\n\u003cp>省略完整凭证时进入交互登录。非交互调用需同时提供 server、user，以及 password 或 token；同时提供两者时优先使用 token。--useEnv 强制从环境变量读取完整凭证。成功后保存服务地址、账号和 Token，并设为当前账号，不保存密码。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-s, --server &lt;url&gt;\u003c/code>\u003c/td>\u003ctd>禅道服务地址\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>-u, --user &lt;account&gt;\u003c/code>\u003c/td>\u003ctd>用户名\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>-p, --password &lt;password&gt;\u003c/code>\u003c/td>\u003ctd>密码\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>-t, --token &lt;token&gt;\u003c/code>\u003c/td>\u003ctd>Token\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--useEnv\u003c/code>\u003c/td>\u003ctd>强制使用环境变量登录\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao login\nzentao login --server=https://zentao.example.com --user=admin --token='替换为实际Token'\nzentao login --useEnv\n\u003c/code>\u003c/pre>\n"},{"id":"command-logout","title":"zentao logout","description":"退出当前用户登录","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>退出当前用户登录\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao logout [options] [profileKey]\n\u003c/code>\u003c/pre>\n\u003cp>不传 profileKey 时退出当前账号；传入时删除指定的本地登录记录。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>profileKey\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>要退出的用户配置（格式：account@server）\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao logout\nzentao logout 'admin@https://zentao.example.com'\n\u003c/code>\u003c/pre>\n"},{"id":"command-profile","title":"zentao profile","description":"查看或切换用户配置","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>查看或切换用户配置\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao profile [options] [profileKey]\n\u003c/code>\u003c/pre>\n\u003cp>不传参数时列出已保存的账号并标记当前账号；传入 account@server 可切换账号。支持 --format=json 和 --format=raw。业务调用存在完整环境变量凭证时，会优先使用环境变量对应的账号。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>profileKey\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>要切换到的用户配置（格式：account@server，例如 admin@https://zentao.example.com）\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao profile\nzentao profile 'admin@https://zentao.example.com'\nzentao --format=json profile\n\u003c/code>\u003c/pre>\n"},{"id":"command-config","title":"zentao config","description":"管理用户配置","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>管理用户配置\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao config [options] [command]\n\u003c/code>\u003c/pre>\n\u003cp>配置保存在当前账号下，需要先登录。使用 get 查看、set 修改，见上方配置项表。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao config get\nzentao config set defaultOutputFormat json\n\u003c/code>\u003c/pre>\n"},{"id":"command-config-get","title":"zentao config get","description":"查看配置","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>查看配置\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao config get [options] [key]\n\u003c/code>\u003c/pre>\n\u003cp>省略 key 时返回当前账号的全部配置，包括未显式设置的默认值。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>key\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>配置项名称\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao config get\nzentao --format=json config get pagers\n\u003c/code>\u003c/pre>\n"},{"id":"command-config-set","title":"zentao config set","description":"设置配置","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>设置配置\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao config set [options] &lt;key&gt; &lt;value&gt;\n\u003c/code>\u003c/pre>\n\u003cp>布尔值只接受 true/false；数值与 pagers 的有效范围见配置项表。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>key\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>配置项名称\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>value\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>配置值\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao config set timeout 30000\nzentao config set defaultRecPerPage 50\nzentao config set pagers '{&quot;product&quot;:50,&quot;bug&quot;:100}'\n\u003c/code>\u003c/pre>\n"},{"id":"command-version","title":"zentao version","description":"显示版本信息","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>显示版本信息\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao version [options]\n\u003c/code>\u003c/pre>\n\u003cp>显示 CLI 版本以及本地已保存的当前服务器信息，不用于实时探测服务器。--version / -V 只输出 CLI 版本号。JSON/raw 输出包含 CLI 版本和已保存的服务器地址。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao version\nzentao --version\nzentao --format=json version\n\u003c/code>\u003c/pre>\n"},{"id":"command-autocomplete","title":"zentao autocomplete","description":"生成 shell 自动补全脚本","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>生成 shell 自动补全脚本\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao autocomplete [options] [shell]\n\u003c/code>\u003c/pre>\n\u003cp>支持 bash、zsh、fish，省略 shell 时在交互终端选择。脚本写入 ~/.config/zentao/.zentao-completion.\u003cshell>，命令会打印启用方式；不会将脚本正文直接输出到标准输出。Bash 使用生成脚本时需要提供 _init_completion 的 bash-completion 环境。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>shell\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>shell 类型 (bash|zsh|fish)\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao autocomplete zsh\nsource ~/.config/zentao/.zentao-completion.zsh\n\u003c/code>\u003c/pre>\n"},{"id":"command-add-skill","title":"zentao add-skill","description":"安装禅道 CLI 技能到 AI Agent，或导出至指定目录","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>安装禅道 CLI 技能到 AI Agent，或导出至指定目录\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao add-skill [options] [agent]\n\u003c/code>\u003c/pre>\n\u003cp>安装或更新内置的 zentao-cli 和 zentao-tour 两个技能。省略 agent 时交互选择，all 表示全部目标。--output 导出到指定目录，与 agent 不能同时使用；重复运行会覆盖目标中的同名技能文件。支持的 Agent 见参数表。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>agent\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>目标 Agent (claude-code|cursor|cherry-studio|codex|opencode|vscode|antigravity|gemini|all)\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-o, --output &lt;path&gt;\u003c/code>\u003c/td>\u003ctd>将所有内置技能导出到指定目录\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao add-skill codex\nzentao add-skill all\nzentao add-skill --output ./exported-skills\n\u003c/code>\u003c/pre>\n"},{"id":"command-add-mcp","title":"zentao add-mcp","description":"配置禅道 MCP 服务到 AI Agent","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>配置禅道 MCP 服务到 AI Agent\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao add-mcp [options] [agent]\n\u003c/code>\u003c/pre>\n\u003cp>使用已登录账号配置目标 Agent 的 MCP 服务；省略 agent 时交互选择，all 表示全部目标。多数目标写入包含服务地址、账号和 Token 的配置；Cherry Studio 打印手动添加说明。包含注释或尾逗号的 JSONC 配置会提示手动处理。支持的 Agent 见参数表。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>agent\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>目标 Agent (cursor|claude-desktop|claude-code|windsurf|cline|trae|vscode|cherry-studio|opencode|codex|antigravity|gemini|all)\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao add-mcp codex\nzentao add-mcp cursor\n\u003c/code>\u003c/pre>\n"},{"id":"command-mcp","title":"zentao mcp","description":"启动 MCP (Model Context Protocol) 服务，供 AI Agents 通过 stdio 访问禅道数据","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>启动 MCP (Model Context Protocol) 服务，供 AI Agents 通过 stdio 访问禅道数据\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao mcp [options]\n\u003c/code>\u003c/pre>\n\u003cp>通过标准输入/输出启动 MCP 服务，由支持 MCP 的客户端运行并管理进程。账户可通过已保存登录或环境变量提供。使用细节见“在 Agents 中使用禅道”。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao mcp\nzentao --config ./zentao.json mcp\n\u003c/code>\u003c/pre>\n"},{"id":"command-ls","title":"zentao ls","description":"获取对象列表","group":"builtin","type":"builtin","aliases":"list","html":"\u003cp>获取对象列表\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao ls [options] &lt;module&gt; [args...]\n\u003c/code>\u003c/pre>\n\u003cp>通用列表入口，list 是此一级命令的别名。需要模块存在默认 list；业务参数与对应模块 list 的参数相同。建议日常使用 zentao &lt;模块&gt;。\u003c/p>\n\u003cp>别名：\u003ccode>list\u003c/code>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>module\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>模块名称，例如 bug\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>args...\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>参数\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>同时接受上方列出的\u003ca href=\"#data-options\">业务命令公共选项\u003c/a>；其实际效果取决于具体业务操作。\u003c/p>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao ls product\nzentao list product\n\u003c/code>\u003c/pre>\n"},{"id":"command-get","title":"zentao get","description":"获取单个对象","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>获取单个对象\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao get [options] &lt;module&gt; &lt;id&gt;\n\u003c/code>\u003c/pre>\n\u003cp>通用详情入口，模块需支持 get。首个 ID 使用位置参数；额外路径参数可通过 --params 提供。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>module\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>模块名称，例如 bug\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>id\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>对象 ID\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>同时接受上方列出的\u003ca href=\"#data-options\">业务命令公共选项\u003c/a>；其实际效果取决于具体业务操作。\u003c/p>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao get bug 42\nzentao get product 1 --pick=id,name\n\u003c/code>\u003c/pre>\n"},{"id":"command-create","title":"zentao create","description":"创建对象","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>创建对象\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao create [options] &lt;module&gt; [args...]\n\u003c/code>\u003c/pre>\n\u003cp>通用创建入口，模块需支持 create；字段与对应模块 create 的参数相同。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>module\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>模块名称，例如 bug\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>args...\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>参数\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>同时接受上方列出的\u003ca href=\"#data-options\">业务命令公共选项\u003c/a>；其实际效果取决于具体业务操作。\u003c/p>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao create product --name='团队知识库'\n\u003c/code>\u003c/pre>\n"},{"id":"command-update","title":"zentao update","description":"更新对象","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>更新对象\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao update [options] &lt;module&gt; [args...]\n\u003c/code>\u003c/pre>\n\u003cp>通用更新入口，模块需支持 update；可使用数字位置参数或 --id。未提供的字段按更新规则自动补全。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>module\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>模块名称，例如 bug\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>args...\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>--id 和其他参数\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>同时接受上方列出的\u003ca href=\"#data-options\">业务命令公共选项\u003c/a>；其实际效果取决于具体业务操作。\u003c/p>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao update product --id=1 --name='团队知识库新版'\n\u003c/code>\u003c/pre>\n"},{"id":"command-delete","title":"zentao delete","description":"删除对象","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>删除对象\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao delete [options] &lt;module&gt; [args...]\n\u003c/code>\u003c/pre>\n\u003cp>通用删除入口，模块需支持 delete；确认与批量规则同模块删除操作。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>module\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>模块名称，例如 bug\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>args...\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>--id 和其他参数\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>同时接受上方列出的\u003ca href=\"#data-options\">业务命令公共选项\u003c/a>；其实际效果取决于具体业务操作。\u003c/p>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao delete product --id=1,2 --yes\n\u003c/code>\u003c/pre>\n"},{"id":"command-do","title":"zentao do","description":"执行对象操作","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>执行对象操作\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao do [options] &lt;module&gt; &lt;action&gt; [args...]\n\u003c/code>\u003c/pre>\n\u003cp>通用命名操作入口，action 必须来自该模块的操作列表；是否需要 ID 以具体操作为准。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>位置参数\u003c/th>\u003cth>必填\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>module\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>模块名称，例如 bug\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>action\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>操作名称，例如 resolve\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>args...\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>--id 和其他参数\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>同时接受上方列出的\u003ca href=\"#data-options\">业务命令公共选项\u003c/a>；其实际效果取决于具体业务操作。\u003c/p>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao do bug resolve 42 --resolution=fixed\nzentao do story getGrades\n\u003c/code>\u003c/pre>\n"},{"id":"command-upgrade","title":"zentao upgrade","description":"检查并升级 CLI 到最新版本","group":"builtin","type":"builtin","aliases":"","html":"\u003cp>检查并升级 CLI 到最新版本\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao upgrade [options]\n\u003c/code>\u003c/pre>\n\u003cp>联网检查最新 CLI 版本；发现新版本后确认升级，--yes 可跳过确认。通过检测到的包管理器执行全局安装。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>-y, --yes\u003c/code>\u003c/td>\u003ctd>跳过确认，直接升级\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>-h, --help\u003c/code>\u003c/td>\u003ctd>显示命令帮助\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示例：\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">zentao upgrade\nzentao upgrade --yes\n\u003c/code>\u003c/pre>\n"},{"id":"modules","title":"业务模块索引","description":"查看全部模块、别名和业务操作数量","group":"guides","type":"guide","html":"\u003cp>本文使用规范操作名，参数名应保留大小写。每个模块同时提供 props 与离线帮助；下表的操作数量只统计业务操作。\u003c/p>\n\u003cp>参数表的默认值列记录显式声明的默认值；“未声明”不表示空值或 0，服务端默认行为还可能写在说明中。分页条数另外受 CLI 配置控制。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>模块\u003c/th>\u003cth>名称\u003c/th>\u003cth>别名\u003c/th>\u003cth>操作数\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ca href=\"#module-user\">user\u003c/a>\u003c/td>\u003ctd>用户\u003c/td>\u003ctd>—\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-program\">program\u003c/a>\u003c/td>\u003ctd>项目集\u003c/td>\u003ctd>—\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-product\">product\u003c/a>\u003c/td>\u003ctd>产品\u003c/td>\u003ctd>—\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-project\">project\u003c/a>\u003c/td>\u003ctd>项目\u003c/td>\u003ctd>—\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-execution\">execution\u003c/a>\u003c/td>\u003ctd>执行\u003c/td>\u003ctd>—\u003c/td>\u003ctd>11\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-productplan\">productplan\u003c/a>\u003c/td>\u003ctd>产品计划\u003c/td>\u003ctd>plan\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-story\">story\u003c/a>\u003c/td>\u003ctd>需求\u003c/td>\u003ctd>—\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-epic\">epic\u003c/a>\u003c/td>\u003ctd>业务需求\u003c/td>\u003ctd>—\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-requirement\">requirement\u003c/a>\u003c/td>\u003ctd>用户需求\u003c/td>\u003ctd>—\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-bug\">bug\u003c/a>\u003c/td>\u003ctd>Bug\u003c/td>\u003ctd>—\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-testcase\">testcase\u003c/a>\u003c/td>\u003ctd>测试用例\u003c/td>\u003ctd>—\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-task\">task\u003c/a>\u003c/td>\u003ctd>任务\u003c/td>\u003ctd>—\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-issue\">issue\u003c/a>\u003c/td>\u003ctd>问题\u003c/td>\u003ctd>—\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-risk\">risk\u003c/a>\u003c/td>\u003ctd>风险\u003c/td>\u003ctd>—\u003c/td>\u003ctd>6\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-meeting\">meeting\u003c/a>\u003c/td>\u003ctd>会议\u003c/td>\u003ctd>—\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-feedback\">feedback\u003c/a>\u003c/td>\u003ctd>反馈\u003c/td>\u003ctd>—\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-ticket\">ticket\u003c/a>\u003c/td>\u003ctd>工单\u003c/td>\u003ctd>—\u003c/td>\u003ctd>9\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-system\">system\u003c/a>\u003c/td>\u003ctd>应用\u003c/td>\u003ctd>—\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-build\">build\u003c/a>\u003c/td>\u003ctd>版本\u003c/td>\u003ctd>—\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-testtask\">testtask\u003c/a>\u003c/td>\u003ctd>测试单\u003c/td>\u003ctd>—\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-release\">release\u003c/a>\u003c/td>\u003ctd>发布\u003c/td>\u003ctd>—\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-file\">file\u003c/a>\u003c/td>\u003ctd>附件\u003c/td>\u003ctd>—\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-workflow\">workflow\u003c/a>\u003c/td>\u003ctd>工作流\u003c/td>\u003ctd>—\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-doc\">doc\u003c/a>\u003c/td>\u003ctd>文档\u003c/td>\u003ctd>—\u003c/td>\u003ctd>41\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-todo\">todo\u003c/a>\u003c/td>\u003ctd>待办\u003c/td>\u003ctd>—\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#module-my\">my\u003c/a>\u003c/td>\u003ctd>地盘\u003c/td>\u003ctd>—\u003c/td>\u003ctd>14\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n"},{"id":"module-user","title":"用户 · user","description":"5 个业务操作与模块快捷用法","group":"user","type":"overview","aliases":"","html":"\u003cp>快捷用法与字段查询：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao user &lt;id&gt;\nzentao user [列表参数]\nzentao user props --format=json\nzentao help user\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>操作\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ca href=\"#action-user-list\">list\u003c/a>\u003c/td>\u003ctd>获取用户列表\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-user-create\">create\u003c/a>\u003c/td>\u003ctd>创建用户\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-user-get\">get\u003c/a>\u003c/td>\u003ctd>获取用户详情\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-user-update\">update\u003c/a>\u003c/td>\u003ctd>修改用户信息\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-user-delete\">delete\u003c/a>\u003c/td>\u003ctd>删除用户\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n"},{"id":"action-user-list","title":"zentao user list","description":"获取用户列表","group":"user","type":"list","parameterCount":6,"aliases":"","html":"\u003cp>最低禅道版本：\u003ccode>22.0\u003c/code> / \u003ccode>biz13.0\u003c/code> / \u003ccode>max8.0\u003c/code> / \u003ccode>ipd5.0\u003c/code>。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao user list [选项]\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>参数\u003c/th>\u003cth>位置\u003c/th>\u003cth>类型\u003c/th>\u003cth>必填\u003c/th>\u003cth>默认值\u003c/th>\u003cth>说明与可选值\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>--browseType\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>浏览类型\u003cbr>可选值：inside（内部用户）；outside（内部用户）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--orderBy\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>排序\u003cbr>可选值：id_asc（ID 升序）；id_desc（ID 降序）；realname_asc（姓名 升序）；realname_desc（姓名 降序）；account_asc（用户名 升序）；account_desc（用户名 降序）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--recPerPage\u003c/code>\u003c/td>\u003ctd> ccode>--params\u003c/code>、\u003ccode>--format\u003c/code>、\u003ccode>--silent\u003c/code>、\u003ccode>--yes\u003c/code>、\u003ccode>--batch-fail-fast\u003c/code>；其他全局选项见\u003ca href=\"#global-options\">全局选项\u003c/a>。\u003c/p>\n"},{"id":"module-story","title":"需求 · story","description":"12 个业务操作与模块快捷用法","group":"story","type":"overview","aliases":"","html":"\u003cp>快捷用法与字段查询：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao story &lt;id&gt;\nzentao story [列表参数]\nzentao story props --format=json\nzentao help story\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>操作\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-list\">list\u003c/a>\u003c/td>\u003ctd>获取需求列表，支持获取项目/产品/执行下的需求\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-modules\">modules\u003c/a>\u003c/td>\u003ctd>产品的需求模块树\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-create\">create\u003c/a>\u003c/td>\u003ctd>创建需求\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-get\">get\u003c/a>\u003c/td>\u003ctd>获取需求详情\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-update\">update\u003c/a>\u003c/td>\u003ctd>修改需求\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-updatemodule\">updateModule\u003c/a>\u003c/td>\u003ctd>修改需求模块\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-delete\">delete\u003c/a>\u003c/td>\u003ctd>删除需求\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-deletemodule\">deleteModule\u003c/a>\u003c/td>\u003ctd>删除需求模块\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-activate\">activate\u003c/a>\u003c/td>\u003ctd>激活需求\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-change\">change\u003c/a>\u003c/td>\u003ctd>变更需求\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-story-close\">close\u003c/a>\u003c/td>\u003ctd>关闭需求\u003c/td>\u003c/tr>\n\ _asc（ID 升序）；id_desc（ID 降序）；title_asc（标题 升序）；title_desc（标题 降序）；status_asc（状态 升序）；status_desc（状态 降序）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--recPerPage\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>number\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>每页数量，不超过1000\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--pageID\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>number\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>页码，从第1页开始\u003cbr>也可使用 --page\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--filters\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>array\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>搜索条件数组，每项包含 field/operator/value/join/group；field 必须是该接口支持的搜索字段，operator 使用该接口搜索配置支持的操作符。支持搜索字段：title(需求名称，示例：关键字)；id(编号，示例：1)；keywords(关键词，示例：关键字)；status(当前状态，枚举：draft 草稿 | reviewing 评审中 | active 激活 | changing 变更中 | closed 已关闭)；pri(优先级，枚举：1 | 2 | 3 | 4)；module(所属模块，示例：all)；stage(所处阶段，枚举：wait 未开始 | planned 已计划 | projected 研发立项 | designing 设计中 | designed 设计完毕 | developing 研发中 | developed 研发完毕 | testing 测试中 | tested 测试完毕 | verified 已验收 | rejected 验收失败 | delivering 交付中 | delivered 已交付 | released 已发布 | closed 已关闭)；product(所属产品，示例：all)；branch(branch，示例：all)；grade(需求层级，示例：all)；plan(所属计划，示例：all)；estimate(预计小时，示例：关键字)；source(来源，枚举：customer 客户 | user 用户 | po 产品经理 | market 市场 | service 客服 | operation 运营 | support 技术支持 | competitor 竞争对手 | partner 合作伙伴 | dev 开发人员 | tester 测试人员 | bug Bug | forum 论坛 | other 其他)；sourceNote(来源备注，示例：关键字)；fromBug(来源Bug，示例：关键字)；category(类别，枚举：feature 功能 | interface 接口 | performance 性能 | safe 安全 | experience 体验 | improve 改进 | other 其他)；openedBy(由谁创建，用户，示例：admin)；reviewedBy(已评审人，用户，示例：admin)；result(评审结果，枚举：pass 确认通过 | revert 撤销变更 | clarify 有待明确 | reject 拒绝)；assignedTo(指派给，用户，示例：admin)；closedBy(由谁关闭，用户，示例：admin)；lastEditedBy(最后修改，用户，示例：admin)；mailto(抄送给，用户，示例：admin)；closedReason(关闭原因，枚举：done 已完成 | subdivided 已拆分 | duplicate 重复 | postponed 延期 | willnotdo 不做 | cancel 已取消 | bydesign 设计如此)；version(版本号，示例：关键字)；openedDate(创建日期，示例：2026-01-01)；reviewedDate(评审时间，示例：2026-01-01)；assignedDate(指派日期，示例：2026-01-01)；closedDate(关闭日期，示例：2026-01-01)；lastEditedDate(最后修改日期，示例：2026-01-01)；activatedDate(激活日期，示例：2026-01-01)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--groupJoin\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>条件组之间的连接方式\u003cbr>可选值：and（and）；or（or）\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>可配合\u003ca href=\"#data-options\">公共选项\u003c/a>：\u003ccode>--params\u003c/code>、\u003ccode>--format\u003c/code>、\u003ccode>--silent\u003c/code>、\u003ccode>--pick\u003c/code>、\u003ccode>--filter\u003c/code>、\u003ccode>--sort\u003c/code>、\u003ccode>--search\u003c/code>、\u003ccode>--search-fields\u003c/code>、\u003ccode>--limit\u003c/code>、\u003ccode>--page\u003c/code>；其他全局选项见\u003ca href=\"#global-options\">全局选项\u003c/a>。\u003c/p>\n"},{"id":"action-story-modules","title":"zentao story modules","description":"产品的需求模块树","group":"story","type":"list","parameterCount":1,"aliases":"","html":"\u003cp>最低禅道版本：\u003ccode>22.5\u003c/code> / \u003ccode>biz13.5\u003c/code> / \u003ccode>max8.5\u003c/code> / \u003ccode>ipd5.5\u003c/code>。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao story modules --productID=&lt;number&gt; [选项]\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>参数\u003c/th>\u003cth>位置\u003c/th>\u003cth>类型\u003c/th>\u003cth>必填\u003c/th>\u003cth>默认值\u003c/th>\u003cth>说明与可选值\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>--productID\u003c/code>\u003c/td>\u003ctd>路径\u003c/td>\u003ctd>\u003ccode>number\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>产品ID\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>--productID\u003c/code> 可用 \u003ccode>--id\u003c/code> 或首个数字位置参数代替；其余路径 ID 需分别提供。\u d>搜索条件数组，每项包含 field/operator/value/join/group；field 必须是该接口支持的搜索字段，operator 使用该接口搜索配置支持的操作符。支持搜索字段：title(需求名称，示例：关键字)；id(编号，示例：1)；keywords(关键词，示例：关键字)；status(当前状态，枚举：draft 草稿 | reviewing 评审中 | active 激活 | changing 变更中 | closed 已关闭)；pri(优先级，枚举：1 | 2 | 3 | 4)；module(所属模块，示例：all)；stage(所处阶段，枚举：wait 未开始 | planned 已计划 | projected 研发立项 | designing 设计中 | designed 设计完毕 | developing 研发中 | developed 研发完毕 | testing 测试中 | tested 测试完毕 | verified 已验收 | rejected 验收失败 | delivering 交付中 | delivered 已交付 | released 已发布 | closed 已关闭)；product(所属产品，示例：all)；branch(branch，示例：all)；grade(需求层级，示例：all)；plan(所属计划，示例：all)；estimate(预计小时，示例：关键字)；source(来源，枚举：customer 客户 | user 用户 | po 产品经理 | market 市场 | service 客服 | operation 运营 | support 技术支持 | competitor 竞争对手 | partner 合作伙伴 | dev 开发人员 | tester 测试人员 | bug Bug | forum 论坛 | other 其他)；sourceNote(来源备注，示例：关键字)；fromBug(来源Bug，示例：关键字)；category(类别，枚举：feature 功能 | interface 接口 | performance 性能 | safe 安全 | experience 体验 | improve 改进 | other 其他)；openedBy(由谁创建，用户，示例：admin)；reviewedBy(已评审人，用户，示例：admin)；result(评审结果，枚举：pass 确认通过 | revert 撤销变更 | clarify 有待明确 | reject 拒绝)；assignedTo(指派给，用户，示例：admin)；closedBy(由谁关闭，用户，示例：admin)；lastEditedBy(最后修改，用户，示例：admin)；mailto(抄送给，用户，示例：admin)；closedReason(关闭原因，枚举：done 已完成 | subdivided 已拆分 | duplicate 重复 | postponed 延期 | willnotdo 不做 | cancel 已取消 | bydesign 设计如此)；version(版本号，示例：关键字)；openedDate(创建日期，示例：2026-01-01)；reviewedDate(评审时间，示例：2026-01-01)；assignedDate(指派日期，示例：2026-01-01)；closedDate(关闭日期，示例：2026-01-01)；lastEditedDate(最后修改日期，示例：2026-01-01)；activatedDate(激活日期，示例：2026-01-01)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--groupJoin\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>条件组之间的连接方式\u003cbr>可选值：and（and）；or（or）\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>--productID\u003c/code> 可用 \u003ccode>--id\u003c/code> 或首个数字位置参数代替；其余路径 ID 需分别提供。\u003c/p>\n\u003cp>可配合\u003ca href=\"#data-options\">公共选项\u003c/a>： 目）；products（产品）；executions（执行）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--scopeID\u003c/code>\u003c/td>\u003ctd>路径\u003c/td>\u003ctd>\u003ccode>number\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>所属范围ID\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--browseType\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>状态\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--orderBy\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>排序\u003cbr>可选值：id_asc（ID 升序）；id_desc（ID 降序）；title_asc（标题 升序）；title_desc（标题 降序）；status_asc（状态 升序）；status_desc（状态 降序）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--recPerPage\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>number\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>每页数量，不超过1000\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--pageID\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>number\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>页码，从第1页开始\u003cbr>也可使用 --page\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--filters\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>array\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>搜索条件数组，每项包含 field/operator/value/join/group；field 必须是该接口支持的搜索字段，operator 使用该接口搜索配置支持的操作符。支持搜索字段：title(Bug标题，示例：关键字)；module(所属模块，模块，示例：0)；keywords(关键词，示例：关键字)；steps(重现步骤，示例：关键字)；assignedTo(指派给，用户，示例：admin)；resolvedBy(解决者，用户，示例：admin)；status(Bug状态，枚举：active 激活 | resolved 已解决 | closed 已关闭)；confirmed(是否确认，枚举：1 已确认 | 0 未确认)；story(相关需求，示例：关键字)；project(所属项目，示例：all)；product(所属产品，示例：all)；branch(branch，示例：all)；plan(所属计划，示例：all)；id(Bug编号，示例：1)；execution(所属执行，执行，示例：3)；severity(严重程度，枚举：1 | 2 | 3 | 4)；pri(优先级，枚举：1 | 2 | 3 | 4)；type(Bug类型，枚举：codeerror 代码错误 | config 配置相关 | install 安装部署 | security 安全 3c/a>\u003c/td>\u003ctd>删除测试用例\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#action-testcase-deletemodule\">deleteModule\u003c/a>\u003c/td>\u003ctd>删除用例模块\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n"},{"id":"action-testcase-list","title":"zentao testcase list","description":"获取测试用例列表，支持获取产品/项目/执行下的测试用例","group":"testcase","type":"list","parameterCount":8,"aliases":"","html":"\u003cp>最低禅道版本：\u003ccode>22.0\u003c/code> / \u003ccode>biz13.0\u003c/code> / \u003ccode>max8.0\u003c/code> / \u003ccode>ipd5.0\u003c/code>。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">zentao testcase list --product=&lt;id&gt; [选项]\n\u003c/code>\u003c/pre>\n\u003cp>范围必填：用法中以 \u003ccode>--product\u003c/code> 为例，也可从 \u003ccode>--product=&lt;id&gt;\u003c/code>（产品）、\u003ccode>--project=&lt;id&gt;\u003c/code>（项目）、\u003ccode>--execution=&lt;id&gt;\u003c/code>（执行） 中选择一个，代替 scope 与 scopeID。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>参数\u003c/th>\u003cth>位置\u003c/th>\u003cth>类型\u003c/th>\u003cth>必填\u003c/th>\u003cth>默认值\u003c/th>\u003cth>说明与可选值\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>--scope\u003c/code>\u003c/td>\u003ctd>路径\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>测试用例所属范围\u003cbr>可选值：products（产品）；projects（项目）；executions（执行）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--scopeID\u003c/code>\u003c/td>\u003ctd>路径\u003c/td>\u003ctd>\u003ccode>number\u003c/code>\u003c/td>\u003ctd>是\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>所属范围ID\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--browseType\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>\u003ccode>&quot;all&quot;\u003c/code>\u003c/td>\u003ctd>状态，默认是all\u003cbr>可选值：all（全部）；wait（未关闭）；needconfirm（需求变动）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--orderBy\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u
