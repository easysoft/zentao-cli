asc（名称 升序）；name_desc（名称 降序）；status_asc（状态 升序）；status_desc（状态 降序）；pri_asc（优先级 升序）；pri_desc（优先级 降序）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--recPerPage\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>number\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>每页数量，不超过1000\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--pageID\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>number\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>页码，从第1页开始\u003cbr>也可使用 --page\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--filters\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>array\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>搜索条件数组，每项包含 field/operator/value/join/group；field 必须是该接口支持的搜索字段，operator 使用该接口搜索配置支持的操作符。支持搜索字段：activateBy,actualClosedDate,assignedTo,cancelBy,category,createdBy,createdDate,editedBy,editedDate,hangupBy,id,identifiedDate,impact,name,plannedClosedDate,prevention,pri,probability,project,rate,remedy,resolution,resolvedBy,source,status,strategy,trackedBy\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>--groupJoin\u003c/code>\u003c/td>\u003ctd>查询\u003c/td>\u003ctd>\u003ccode>string\u003c/code>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>未声明\u003c/td>\u003ctd>条件组之间的连接方式\u003cbr>可选值：and（and）；or（or）\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>可配合\u003ca href=\"#data-options\">公共选项\u003c/a>：\u003ccode>--params\u003c/code>、\u003ccode>--format\u003c/code>、\u003ccode>--silent\u003c/code>、\u003ccode>--pick\u003c/code>、\u003ccode>--filter\u003c/code>、\u003ccode>--sort\u003c/code>、\u003ccode>--search\u003c/code>、\u003ccode>--search-fields\u003c/code>、\u003ccode>--limit\u003c/code>、\u003ccode>--page\u003c/code>；其他全局选项见\u003ca href=\"#global-options\">全局选项\u003c/a>。\u003c/p>\n"}]}</script>
  <script>
    'use strict';
    const data = JSON.parse(document.getElementById('reference-data').textContent);
    const byId = new Map(data.entries.map(entry => [entry.id, entry]));
    const $ = id => document.getElementById(id);
    const types = { guide: '使用指南', overview: '模块概览', builtin: '内置命令', list: '查询列表', get: '查看详情', create: '创建', update: '更新', delete: '删除', action: '其他业务操作' };
    const scopes = [
      { id: 'all', label: '全部内容' }, { id: 'guides', label: '使用指南' }, { id: 'builtin', label: '内置命令' },
      ...data.modules.map(mod => ({ id: mod.name, label: mod.display, code: mod.name })),
    ];
    const template = document.createElement('template');
    for (const entry of data.entries) {
      template.innerHTML = entry.html;
      entry.searchText = [entry.title, entry.description, entry.aliases || '', template.content.textContent].join(' ').toLowerCase();
    }
    let scope = 'all';
    let selected = byId.has(location.hash.slice(1)) ? location.hash.slice(1) : 'usage';
    let visible = [];
    let parameterRows = [];
    let noticeTimer;
    let searchTimer;
    const systemTheme = matchMedia('(prefers-color-scheme: dark)');
    try { const saved = localStorage.getItem('zentao-reference-theme'); if (['system', 'light', 'dark'].includes(saved)) $('theme').value = saved; } catch {}
    function applyTheme() {
      const choice = $('theme').value;
      document.documentElement.dataset.theme = choice === 'system' ? (systemTheme.matches ? 'dark' : 'light') : choice;
    }
    $('theme').addEventListener('change', () => { applyTheme(); try { localStorage.setItem('zentao-reference-theme', $('theme').value); } catch {} });
    systemTheme.addEventListener('change', applyTheme);
    applyTheme();
    $('version-info').textContent = 'CLI ' + data.version + ' · ' + data.actionCount + ' 个业务操作 · 离线可用';
    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function terms(value) { return value.toLowerCase().trim().split(/\s+/).filter(Boolean); }
    function matchesScope(entry, value) { return value === 'all' || entry.group === value; }
    for (const item of scopes) {
      if (item.id === data.modules[0]?.name) $('scope-nav').append(element('div', 'nav-label', '业务模块'));
      const button = element('button', 'scope-button');
      button.dataset.scope = item.id;
      const label = element('span', '', item.label);
      if (item.code) label.append(element('span', 'module-name mono', item.code));
      button.append(label, element('span', 'count'));
      button.addEventListener('click', () => { scope = item.id; renderResults(); });
      $('scope-nav').append(button);
      const option = element('option', '', item.label + (item.code ? ' · ' + item.code : ''));
      option.value = item.id;
      $('scope-select').append(option);
    }
    function renderResults() {
      clearTimeout(searchTimer);
      const query = terms($('search').value);
      const type = $('type-filter').value;
      const candidates = data.entries.filter(entry => (!type || entry.type === type) && query.every(term => entry.searchText.includes(term)));
      if (query.length) {
        const matchesTitle = entry => query.every(term => (entry.title + ' ' + (entry.aliases || '')).toLowerCase().includes(term));
        candidates.sort((a, b) => Number(matchesTitle(b)) - Number(matchesTitle(a)));
      }
      visible = candidates.filter(entry => matchesScope(entry, scope));
      $('scope-select').value = scope;
      $('scope-title').textContent = scopes.find(item => item.id === scope).label;
      $('result-count').textContent = visible.length + ' 条';
      for (const button of $('scope-nav').querySelectorAll('button')) {
        button.setAttribute('aria-current', String(button.dataset.scope === scope));
        button.querySelector('.count').textContent = candidates.filter(entry => matchesScope(entry, button.dataset.scope)).length;
      }
      const fragment = document.createDocumentFragment();
      if (!visible.some(entry => entry.id === selected)) selected = visible[0]?.id;
      for (const entry of visible) {
        const button = element('button', 'result-item');
        button.dataset.entry = entry.id;
        button.setAttribute('aria-current', String(entry.id === selected));
        button.append(element('span', 'title' + (entry.title.startsWith('zentao ') ? ' mono' : ''), entry.title));
        button.append(element('span', 'description', entry.description));
        button.append(element('span', 'entry-type', types[entry.type] + (entry.parameterCount === undefined ? '' : ' · ' + entry.parameterCount + ' 个参数')));
        button.addEventListener('click', () => openEntry(entry.id));
        fragment.append(button);
      }
      $('result-list').replaceChildren(fragment);
      $('no-results').hidden = visible.length > 0;
      renderDetail();
    }
    function openEntry(id, updateHistory = true) {
      if (!byId.has(id)) return;
      selected = id;
      if (!visible.some(entry => entry.id === id)) { scope = 'all'; $('search').value = ''; $('type-filter').value = ''; renderResults(); }
      else {
        for (const button of $('result-list').querySelectorAll('button')) button.setAttribute('aria-current', String(button.dataset.entry === id));
        renderDetail();
      }
      if (updateHistory && location.hash !== '#' + id) history.pushState(null, '', '#' + id);
      document.body.dataset.mobileView = 'reader';
      if (matchMedia('(max-width: 700px)').matches) $('entry-title').focus({ preventScroll: true });
      $('result-list').querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest' });
    }
    function renderDetail() {
      const entry = byId.get(selected);
      $('reader-inner').hidden = !entry;
      $('reader-empty').hidden = !!entry;
      if (!entry) return;
      document.title = entry.title + ' · ZenTao CLI';
      $('entry-title').textContent = entry.title;
      $('entry-title').classList.toggle('mono', entry.title.startsWith('zentao '));
      $('entry-description').textContent = entry.description;
      const groupLabel = scopes.find(item => item.id === entry.group).label;
      $('breadcrumb').textContent = '命令参考 / ' + groupLabel;
      if (groupLabel !== types[entry.type]) $('breadcrumb').append(element('span', 'entry-badge', types[entry.type]));
      $('entry-content').innerHTML = entry.html;
      $('parameter-search').value = '';
      $('required-only').checked = false;
      parameterRows = [];
      let hasRequired = false;
      for (const table of $('entry-content').querySelectorAll('table')) {
        const headers = Array.from(table.querySelectorAll('thead th'), th => th.textContent.trim());
        const requiredIndex = headers.indexOf('必填');
        const filterable = ['参数', '位置参数', '选项', '配置项', '变量'].includes(headers[0]);
        if (headers.length === 6 && headers[0] === '参数') table.classList.add('parameter-table');
        if (filterable) for (const row of table.querySelectorAll('tbody tr')) {
          const required = requiredIndex >= 0 && row.cells[requiredIndex].textContent.trim() === '是';
          if (required) row.cells[requiredIndex].classList.add('is-required');
          parameterRows.push({ row, text: row.textContent.toLowerCase(), required, canRequire: requiredIndex >= 0 });
        }
        hasRequired ||= filterable && requiredIndex >= 0;
        for (const cell of table.querySelectorAll('tbody td:last-child')) {
          if (cell.textContent.length < 280) continue;
          const details = element('details', 'long-description');
          const summary = element('summary');
          summary.append(element('span', 'preview', cell.textContent.trim().slice(0, 125) + '…'), element('span', 'expand-label', '展开完整说明'), element('span', 'collapse-label', '收起说明'));
          const full = element('div', 'full-description');
          full.append(...Array.from(cell.childNodes));
          details.append(summary, full);
          cell.append(details);
        }
        const wrapper = element('div', 'table-scroll');
        wrapper.tabIndex = 0;
        wrapper.setAttribute('role', 'region');
        wrapper.setAttribute('aria-label', headers.join('、') + '，可左右滚动');
        table.before(wrapper);
        wrapper.append(table);
      }
      $('parameter-tools').hidden = parameterRows.length === 0;
      $('required-control').hidden = !hasRequired;
      filterParameters();
      for (const pre of $('entry-content').querySelectorAll('pre')) {
        const wrapper = element('div', 'code-block');
        const toolbar = element('div', 'code-toolbar');
        const copy = element('button', '', '复制');
        const text = pre.textContent;
        copy.setAttribute('aria-label', '复制代码或用法');
        copy.addEventListener('click', () => copyText(text, copy));
        toolbar.append(element('span', '', pre.querySelector('.language-bash') ? '命令示例' : '用法 / 参考'), copy);
        pre.before(wrapper);
        wrapper.append(toolbar, pre);
      }
      $('reader').scrollTop = 0;
    }
    function filterParameters() {
      const query = terms($('parameter-search').value);
      const requiredOnly = $('required-only').checked;
      let count = 0;
      for (const item of parameterRows) {
        item.row.hidden = !(query.every(term => item.text.includes(term)) && (!requiredOnly || !item.canRequire || item.required));
        if (!item.row.hidden) count++;
      }
      $('parameter-count').textContent = count + ' / ' + parameterRows.length + ' 项';
      $('parameter-empty').hidden = !parameterRows.length || count > 0;
    }
    async function copyText(text, button) {
      let copied = false;
      try { await navigator.clipboard.writeText(text); copied = true; } catch {
        const input = element('textarea');
        input.value = text;
        input.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.append(input);
        input.select();
        try { copied = document.execCommand('copy'); } catch {}
        input.remove();
        button?.focus({ preventScroll: true });
      }
      $('copy-notice').textContent = copied ? '已复制' : '复制失败，请手动选择并复制文本。';
      $('copy-notice').hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => { $('copy-notice').hidden = true; }, 2200);
    }
    function resetFilters() { scope = 'all'; $('search').value = ''; $('type-filter').value = ''; renderResults(); }
    $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderResults, 100); document.body.dataset.mobileView = 'list'; });
    $('type-filter').addEventListener('change', renderResults);
    $('scope-select').addEventListener('change', () => { scope = $('scope-select').value; renderResults(); });
    $('reset-filters').addEventListener('click', resetFilters);
    $('clear-empty').addEventListener('click', resetFilters);
    $('parameter-search').addEventListener('input', filterParameters);
    $('required-only').addEventListener('change', filterParameters);
    $('copy-link').addEventListener('click', event => { const url = new URL(location.href); url.hash = selected; copyText(url.href, event.currentTarget); });
    $('back-to-list').addEventListener('click', () => { document.body.dataset.mobileView = 'list'; $('result-list').querySelector('[aria-current="true"]')?.focus(); });
    $('entry-content').addEventListener('click', event => { const link = event.target.closest('a[href^="#"]'); if (link && byId.has(link.hash.slice(1))) { event.preventDefault(); openEntry(link.hash.slice(1)); } });
    document.querySelector('.skip-link').addEventListener('click', () => { document.body.dataset.mobileView = 'reader'; });
    document.addEventListener('keydown', event => {
      const editing = event.target.matches('input, textarea, select, [contenteditable="true"]');
      if ((event.key === '/' && !editing) || ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k')) { event.preventDefault(); $('search').focus(); $('search').select(); }
      if (event.key === 'Escape' && event.target === $('search')) { $('search').value = ''; renderResults(); }
    });
    window.addEventListener('popstate', () => openEntry(location.hash.slice(1) || 'usage', false));
    window.addEventListener('hashchange', () => openEntry(location.hash.slice(1) || 'usage', false));
    renderResults();
    if (location.hash && byId.has(location.hash.slice(1))) document.body.dataset.mobileView = 'reader';
  </script>
